name: Build and Deploy
'on':
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-and-deploy
  cancel-in-progress: false
jobs:
  build-and-deploy:
    name: Build and publish validated image
    runs-on: ubuntu-latest
    enable-openid-connect: true
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
    - name: Check application image inputs
      id: scope
      env:
        BASE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" || git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(backend/|frontend/|Dockerfile$|\.dockerignore$|\.forgejo/workflows/build-and-deploy\.yaml$)'; then
          echo changed=true >> "$GITHUB_OUTPUT"
        fi
    - name: Install Azure CLI
      if: steps.scope.outputs.changed == 'true'
      run: |
        if ! command -v az; then curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash; fi
    - uses: https://github.com/azure/login@v3
      if: steps.scope.outputs.changed == 'true'
      with:
        client-id: ${{ vars.ARM_CLIENT_ID }}
        tenant-id: ${{ vars.ARM_TENANT_ID }}
        subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
    - name: ACR login
      if: steps.scope.outputs.changed == 'true'
      run: |
        az acr login --name romainecr
        echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
    - uses: https://github.com/docker/setup-buildx-action@v4
      if: steps.scope.outputs.changed == 'true'
      with:
        driver-opts: network=host
    - name: Build and push image
      if: steps.scope.outputs.changed == 'true'
      uses: https://github.com/docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: romainecr.azurecr.io/diagrams:${{ env.TAG }}
        network: host
        build-args: SOURCE_SHA=${{ github.sha }}
        cache-from: type=registry,ref=romainecr.azurecr.io/diagrams-build-cache:app
        cache-to: type=registry,ref=romainecr.azurecr.io/diagrams-build-cache:app,mode=max
    - name: Smoke-test the published image
      if: steps.scope.outputs.changed == 'true'
      env:
        SMOKE_IMAGE: romainecr.azurecr.io/diagrams:${{ env.TAG }}
      run: |
        set -euo pipefail
        name="diagrams-smoke-$GITHUB_RUN_ID"
        trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
        docker run -d --network none --name "$name" "$SMOKE_IMAGE"
        for n in $(seq 1 40); do
          if docker exec "$name" node -e 'fetch("http://127.0.0.1:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then break; fi
          sleep 1
        done
        docker exec -e EXPECTED_SHA="$(git rev-parse HEAD)" "$name" node --input-type=module -e '
        import assert from "node:assert/strict";
        const base="http://127.0.0.1:3000";
        assert.equal((await (await fetch(base+"/health")).json()).status,"healthy");
        assert.equal((await (await fetch(base+"/version.json")).json()).sha,process.env.EXPECTED_SHA);
        for (const path of ["/", "/pipelines", "/fzt", "/ci/codex"]) {
          const r=await fetch(base+path); assert.equal(r.status,200,path); assert.ok((await r.text()).includes("<div id=\"root\"></div>"),path);
        }
        const html=await (await fetch(base+"/")).text();
        const assets=[...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(m=>m[1]);
        assert.ok(assets.some(p=>p.endsWith(".js"))); assert.ok(assets.some(p=>p.endsWith(".css")));
        for (const path of assets) {const r=await fetch(base+path); assert.equal(r.status,200,path); assert.ok((await r.text()).length>0,path);}
        for (const path of ["/ci/versions", "/ci/status", "/ci/events", "/ci/fzt", "/ci/tofu"]) assert.equal((await fetch(base+path)).status,404,path);
        for (const path of ["/ci/webhook", "/ci/deployed"]) assert.equal((await fetch(base+path,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).status,404,path);
        assert.equal((await fetch(base+"/ci/codex/status")).status,200);
        console.log("Architecture frontend assets, Codex Queue, retired endpoints and exact source SHA verified");'
    - name: Propose and merge the checked image pin
      if: steps.scope.outputs.changed == 'true' && github.ref == 'refs/heads/main'
      env:
        TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
      run: |
        set -euo pipefail
        api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
        branch="FORGEJO-3-image-$GITHUB_RUN_ID"
        git switch -c "$branch"
        sed -i "s|^  tag: .*|  tag: \"${TAG}\"|" k8s/values.yaml
        git config user.name forgejo-actions
        git config user.email forgejo-actions@noreply.romaine.life
        git add k8s/values.yaml
        if git diff --cached --quiet; then exit 0; fi
        git commit -m "chore: pin diagrams image $TAG"
        git push origin "$branch"
        body=$(jq -n --arg head "$branch" '{head:$head,base:"main",title:"Deploy validated diagrams image",body:"https://openproject.romaine.life/wp/FORGEJO-3"}')
        pr=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls" | jq -er .number)
        head=$(git rev-parse HEAD)
        passed=false
        for n in $(seq 1 60); do
          statuses=$(printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- "$api/commits/$head/status")
          state=$(echo "$statuses" | jq -r '
            [.statuses[]? | select(.context == "Docker Build Check / Build app image (pull_request)" or .context == "Infrastructure / Plan and apply (pull_request)" or .context == "Lint / Repository lint (pull_request)")]
            | group_by(.context) | map(max_by(.updated_at))
            | if any(.[]; .status == "failure" or .status == "error") then "failure"
              elif length == 3 and all(.[]; .status == "success") then "success" else "pending" end')
          if [ "$state" = failure ]; then echo "Image pin PR $pr failed required checks"; exit 1; fi
          if [ "$state" = success ]; then passed=true; break; fi
          sleep 30
        done
        if [ "$passed" != true ]; then echo "Image pin PR $pr did not finish all required checks"; exit 1; fi
        body=$(jq -n --arg head "$head" '{Do:"squash",delete_branch_after_merge:true,head_commit_id:$head}')
        printf 'Authorization: token %s\n' "$TOKEN" | curl --fail-with-body -sS --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls/$pr/merge"
